# data-box: server behind Caddy with automatic TLS.
#   cp env.example .env && nano .env
#   mkdir -p data && sudo chown 10001:10001 data && sudo chmod 700 data   # server runs as uid 10001
#   docker compose up -d --build
#   docker compose exec server data-box token create Иван
name: data-box

services:
  server:
    build: ./server
    image: data-box:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_BOX_DIR: /data
      DATA_BOX_ADDR: 0.0.0.0:8790
    volumes:
      - ./data:/data
    read_only: true
    tmpfs: [/tmp]          # multipart uploads spill here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [server]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # ports 80/443
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

volumes:
  caddy-data:
  caddy-config:

networks:
  internal:
